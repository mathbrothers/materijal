<body>
  <main>
    <h1>Zadatak 2</h1>
    <p>Neka je</p>
    <div class="formula">
      \[
        A=\left\{(a,b)\mid a,b\in\mathbb{R},\ a^2+b^2\ne 0\right\}
      \]
    </div>
    <p>i neka je operacija \(\ast\) definisana sa</p>
    <div class="formula">
      \[
        (a,b)\ast(c,d)=(ac-3bd,\ ad+bc).
      \]
    </div>
    <p class="question">Da li je \((A,\ast)\) Abelova grupa?</p>
  </main>
